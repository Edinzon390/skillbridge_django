services:
  - type: web
    name: skillbridge
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_institutions && python manage.py seed_opportunities && python manage.py create_company_admin
    startCommand: gunicorn skillbridge.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_NAME
        value: "skillbridge"
