{% extends "base.html" %}

{% block title %}Recuperar contraseña - SkillBridge{% endblock %}

{% block public_content %}
<div class="auth-container" style="min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 2rem; background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(236, 72, 153, 0.08) 100%);">
    <div class="card" style="max-width: 480px; width: 100%;">
        <div class="card-header">
            <h1 class="card-title"><i class="fas fa-lock"></i> Recuperar contraseña</h1>
            <p class="card-subtitle">Te enviaremos instrucciones a tu correo.</p>
        </div>
        <div class="card-body">
            <form method="post" class="form-group">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="tu@correo.com" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Enviar instrucciones</button>
            </form>
            <p style="margin-top: 1rem; text-align: center; color: var(--text-secondary);">
                <a href="{% url 'frontend:login' %}" style="color: var(--primary-color); font-weight: 600;">Volver al inicio de sesión</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
