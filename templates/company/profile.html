{% extends "base.html" %}

{% block title %}Perfil de Empresa | SkillBridge{% endblock %}

{% block content %}
<div class="page-header" style="margin-bottom: 1.5rem;">
    <h1 style="font-size: 1.75rem;"><i class="fas fa-building"></i> Perfil de la Empresa</h1>
    <p style="color: var(--text-secondary);">Edita la información de tu empresa para mostrarla en las ofertas.</p>
</div>

<div style="max-width: 900px;">
    <form method="post" class="card">
        {% csrf_token %}
        <div class="card-body">
            <div class="form-group">
                <label class="form-label">Nombre de la empresa</label>
                <input type="text" name="name" class="form-input" value="{{ company.name }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Correo de contacto</label>
                    <input type="email" name="email" class="form-input" value="{{ company.email }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Teléfono</label>
                    <input type="tel" name="phone" class="form-input" value="{{ company.phone }}">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Sitio web</label>
                <input type="url" name="website" class="form-input" value="{{ company.website }}">
            </div>

            <div class="form-group">
                <label class="form-label">Dirección</label>
                <input type="text" name="address" class="form-input" value="{{ company.address }}">
            </div>

            <div style="display:flex; gap:1rem; margin-top:1rem;">
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                <a href="{% url 'frontend:company-offers' %}" class="btn btn-outline">Volver a Ofertas</a>
            </div>
        </div>
    </form>
</div>

{% endblock %}
